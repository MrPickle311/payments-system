server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus # Otwiera endpoint /actuator/prometheus
  metrics:
    tags:
      application: ${spring.application.name} # Ułatwi filtrowanie w Grafanie
  tracing:
    sampling:
      probability: 1.0 # 100% zapytań jest śledzonych (na produkcję daje się np. 0.1)
  otlp:
    tracing:
      # Celuje w Tempo w namespace 'monitoring'
      endpoint: http://tempo.monitoring.svc.cluster.local:4318/v1/traces

jdbc:
  datasource-proxy:
    enabled: true

spring:
  application:
    name: ledger-service
  threads:
    virtual:
      enabled: true

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    properties:
      sasl.mechanism: OAUTHBEARER
      sasl.login.callback.handler.class: io.strimzi.kafka.oauth.client.JaasClientOauthLoginCallbackHandler
      sasl.jaas.config: org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required oauth.client.id="${KAFKA_OAUTH_CLIENT_ID:}" oauth.client.secret="${KAFKA_OAUTH_CLIENT_SECRET:}" oauth.token.endpoint.uri="${KAFKA_OAUTH_TOKEN_ENDPOINT:}";
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    consumer:
      group-id: ledger-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

logging:
  level:
    com.example.payments: DEBUG
