# ─────────────────────────────────────────────────────────────────
# Base configuration — loaded by ALL profiles.
# Profile-specific overrides live in:
#   application-listener.yml
#   application-manager.yml
#   application-retry-manager.yml
# ─────────────────────────────────────────────────────────────────

server:
  port: 8083

spring:
  application:
    name: export-batch-service
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment_batch_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      transaction-isolation: TRANSACTION_READ_COMMITTED
      pool-name: BatchHikariCP

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      sasl.mechanism: OAUTHBEARER
      sasl.login.callback.handler.class: io.strimzi.kafka.oauth.client.JaasClientOauthLoginCallbackHandler
      sasl.jaas.config: org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required oauth.client.id="${KAFKA_OAUTH_CLIENT_ID:}" oauth.client.secret="${KAFKA_OAUTH_CLIENT_SECRET:}" oauth.token.endpoint.uri="${KAFKA_OAUTH_TOKEN_ENDPOINT:}";
    consumer:
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

logging:
  level:
    com.example.payments: DEBUG
    org.springframework.batch: INFO

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  metrics:
    tags:
      application: ${spring.application.name}
